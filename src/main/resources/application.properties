# App
spring.application.name=springboot-cicd-demo
server.port=8081

# Actuator - expose health, info, prometheus endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Info endpoint metadata
info.app.name=springboot-cicd-demo
info.app.version=1.0.0
info.app.description=Production Jenkins CICD Pipeline Demo